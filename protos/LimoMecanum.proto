# This is a proto file for Webots for the LimoMecanum (AgileX LIMO with mecanum wheels,
# omnidirectional). Body, sensors, dimensions and masses are identical to
# LimoFourDiff.proto; only the wheels differ.
#
# The rollers are not modelled. As in the Webots KUKA youBot, each wheel is a plain
# cylinder whose contact friction is asymmetric and rotated by +/-45 degrees:
#   front-right, rear-left  -> contactMaterial "InteriorWheelMat"
#   front-left,  rear-right -> contactMaterial "ExteriorWheelMat"
# The world must define ContactProperties for both materials (see
# worlds/limo_world_mecanum.wbt).
#
# The friction direction follows each wheel Solid's local frame, so all four wheel
# Solids share the same orientation here (LimoFourDiff flips the right-hand ones by
# 180 degrees; here only their visual mesh is flipped).

PROTO LimoMecanum [
  field  SFVec3f     translation     0 0 0
  field  SFRotation  rotation        0 0 1 0
  field  SFString    name            "LimoMecanum"   # Is `Robot.name`.
  field  SFString    controller      "<extern>"      # Is `Robot.controller`.
  field  MFString    controllerArgs  []              # Is `Robot.controllerArgs`.
  field  SFString    customData      ""              # Is `Robot.customData`.
  field  SFBool      supervisor      FALSE           # Is `Robot.supervisor`.
  field  SFBool      synchronization TRUE            # Is `Robot.synchronization`.
  field  SFBool      selfCollision   FALSE           # Is `Robot.selfCollision`.
]
{
  Robot {
    translation IS translation
    rotation IS rotation
    controller IS controller
    controllerArgs IS controllerArgs
    customData IS customData
    supervisor IS supervisor
    synchronization IS synchronization
    selfCollision IS selfCollision
    children [
      # Base body visual mesh
      Pose {
        translation 0.000000 0.000000 -0.150000
        rotation 0.000000 0.000000 1.000000 1.570000
        children [
          DEF limo_base_visual CadShape {
            url "meshes/limo_base.dae"
          }
        ]
      }
      # Lidar sensor (height matches AgileX official limo_four_diff.xacro: 0.111 m above ground)
      Solid {
        translation 0.103000 0.000000 -0.034000
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.500000 0.500000 0.500000
              roughness 1.000000
              metalness 0
            }
            geometry Cylinder {
              radius 0.02
              height 0.01
            }
          }
          Lidar {
            # AgileX LIMO Pro uses the EAI/YDLIDAR T-mini Pro:
            # 360deg 2D TOF, 0.02-12 m, 0.54deg angular step (~667 pts/scan), 6-12 Hz.
            name "laser"
            fieldOfView 6.283180
            horizontalResolution 667
            numberOfLayers 1
            near 0.25
            minRange 0.250000
            maxRange 12.000000
            noise 0.003000
            resolution 0.015000
          }
        ]
        name "laser_link"
        boundingObject Cylinder {
          radius 0.032
          height 0.016
        }
        physics Physics {
          density -1
          mass 0.100000
          centerOfMass [ 0.000000 0.000000 0.000000 ]
          inertiaMatrix [
            1.000000e-06 1.000000e-06 1.000000e-06
            0.000000e+00 0.000000e+00 0.000000e+00
          ]
        }
      }
      # Depth camera (Orbbec DaBai Astra Stereo S U3):
      #   RGB up to 1920x1080 @30fps, Depth up to 1280x800 @30fps
      #   FoV 67.9 deg H x 45.3 deg V (H FoV = 1.185 rad)
      #   Depth range 0.3 - 3 m
      # Native res is heavy for realtime sim; use half-res that keeps the same aspect
      # (1920x1080 -> 960x540; 1280x800 -> 640x400).
      Solid {
        translation 0.084000 0.000000 0.030000
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.500000 0.500000 0.500000
              roughness 1.000000
              metalness 0
            }
            geometry Box {
              size 0.020000 0.060000 0.015000
            }
          }
          Camera {
            name "rgb_camera"
            fieldOfView 1.185
            width 960
            height 540
          }
          RangeFinder {
            name "depth_camera"
            fieldOfView 1.185
            width 640
            height 400
            near 0.300000
            minRange 0.300000
            maxRange 3.000000
          }
        ]
        name "depth_camera_link"
        boundingObject Box {
          size 0.020000 0.060000 0.015000
        }
        physics Physics {
          density -1
          mass 0.100000
          centerOfMass [ 0.000000 0.000000 0.000000 ]
          inertiaMatrix [
            1.000000e-06 1.000000e-06 1.000000e-06
            0.000000e+00 0.000000e+00 0.000000e+00
          ]
        }
      }
      # IMU sensor block
      Solid {
        translation 0.000000 0.000000 -0.100000
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.500000 0.500000 0.500000
              roughness 1.000000
              metalness 0
            }
            geometry Box {
              size 0.001000 0.001000 0.001000
            }
          }
          InertialUnit {
            name "imu inertial"
          }
          Accelerometer {
            name "imu accelerometer"
          }
          Gyro {
            name "imu gyro"
          }
          Compass {
            name "imu compass"
          }
        ]
        name "imu_link"
        boundingObject Box {
          size 0.001000 0.001000 0.001000
        }
        physics Physics {
          density -1
          mass 0.010000
          centerOfMass [ 0.000000 0.000000 0.000000 ]
          inertiaMatrix [
            1.000000e-07 1.000000e-07 1.000000e-07
            0.000000e+00 0.000000e+00 0.000000e+00
          ]
        }
      }
      # Front left wheel
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0.000000 1.000000 0.000000
          anchor 0.100000 0.065000 -0.100000
        }
        device [
          RotationalMotor {
            name "front_left_wheel"
            maxVelocity 20
            maxTorque 10000
          }
          PositionSensor {
            name "front_left_wheel_sensor"
          }
        ]
        endPoint Solid {
          translation 0.100000 0.065000 -0.100000
          children [
            DEF limo_wheel_visual CadShape {
              url "meshes/limo_wheel.dae"
            }
          ]
          name "front_left_wheel_link"
          contactMaterial "ExteriorWheelMat"
          boundingObject Pose {
            translation 0.000000 0.022500 0.000000
            rotation 1.000000 0.000000 0.000000 -1.570800
            children [
              Cylinder {
                radius 0.045
                height 0.045
              }
            ]
          }
          physics Physics {
            density -1
            mass 0.500000
            centerOfMass [ 0.000000 0.000000 0.000000 ]
            inertiaMatrix [
              1.055000e-02 7.500000e-04 1.055000e-02
              0.000000e+00 0.000000e+00 0.000000e+00
            ]
          }
        }
      }
      # Front right wheel
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0.000000 1.000000 0.000000
          anchor 0.100000 -0.065000 -0.100000
        }
        device [
          RotationalMotor {
            name "front_right_wheel"
            maxVelocity 20
            maxTorque 10000
          }
          PositionSensor {
            name "front_right_wheel_sensor"
          }
        ]
        endPoint Solid {
          translation 0.100000 -0.065000 -0.100000
          children [
            Pose {
              rotation 1.000000 0.000000 0.000000 3.141590
              children [
                USE limo_wheel_visual
              ]
            }
          ]
          name "front_right_wheel_link"
          contactMaterial "InteriorWheelMat"
          boundingObject Pose {
            translation 0.000000 -0.022500 0.000000
            rotation 1.000000 0.000000 0.000000 -1.570800
            children [
              Cylinder {
                radius 0.045
                height 0.045
              }
            ]
          }
          physics Physics {
            density -1
            mass 0.500000
            centerOfMass [ 0.000000 0.000000 0.000000 ]
            inertiaMatrix [
              1.055000e-02 7.500000e-04 1.055000e-02
              0.000000e+00 0.000000e+00 0.000000e+00
            ]
          }
        }
      }
      # Rear left wheel
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0.000000 1.000000 0.000000
          anchor -0.100000 0.065000 -0.100000
        }
        device [
          RotationalMotor {
            name "rear_left_wheel"
            maxVelocity 20
            maxTorque 10000
          }
          PositionSensor {
            name "rear_left_wheel_sensor"
          }
        ]
        endPoint Solid {
          translation -0.100000 0.065000 -0.100000
          children [
            USE limo_wheel_visual
          ]
          name "rear_left_wheel_link"
          contactMaterial "InteriorWheelMat"
          boundingObject Pose {
            translation 0.000000 0.022500 0.000000
            rotation 1.000000 0.000000 0.000000 -1.570800
            children [
              Cylinder {
                radius 0.045
                height 0.045
              }
            ]
          }
          physics Physics {
            density -1
            mass 0.500000
            centerOfMass [ 0.000000 0.000000 0.000000 ]
            inertiaMatrix [
              1.055000e-02 7.500000e-04 1.055000e-02
              0.000000e+00 0.000000e+00 0.000000e+00
            ]
          }
        }
      }
      # Rear right wheel
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0.000000 1.000000 0.000000
          anchor -0.100000 -0.065000 -0.100000
        }
        device [
          RotationalMotor {
            name "rear_right_wheel"
            maxVelocity 20
            maxTorque 10000
          }
          PositionSensor {
            name "rear_right_wheel_sensor"
          }
        ]
        endPoint Solid {
          translation -0.100000 -0.065000 -0.100000
          children [
            Pose {
              rotation 1.000000 0.000000 0.000000 3.141590
              children [
                USE limo_wheel_visual
              ]
            }
          ]
          name "rear_right_wheel_link"
          contactMaterial "ExteriorWheelMat"
          boundingObject Pose {
            translation 0.000000 -0.022500 0.000000
            rotation 1.000000 0.000000 0.000000 -1.570800
            children [
              Cylinder {
                radius 0.045
                height 0.045
              }
            ]
          }
          physics Physics {
            density -1
            mass 0.500000
            centerOfMass [ 0.000000 0.000000 0.000000 ]
            inertiaMatrix [
              1.055000e-02 7.500000e-04 1.055000e-02
              0.000000e+00 0.000000e+00 0.000000e+00
            ]
          }
        }
      }
    ]
    name IS name
    boundingObject Box {
      size 0.130000 0.120000 0.100000
    }
    physics Physics {
      density -1
      mass 2.155700
      centerOfMass [ 0.000000 0.000000 0.000000 ]
      inertiaMatrix [
        2.400000e-01 9.600000e-01 9.600000e-01
        0.000000e+00 0.000000e+00 0.000000e+00
      ]
    }
  }
}
